name: Sync from Slack and publish

on:
  schedule:
    # Every 15 minutes, on off-peak minutes: GitHub drops more scheduled runs at :00.
    # Runs with no new Slack posts finish in seconds and don't republish the site.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      full_resync:
        description: "Rebuild the whole feed from the channel history"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atn
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull new posts from #above-the-noise
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          FULL_RESYNC: ${{ inputs.full_resync && '1' || '0' }}
        run: python scripts/sync_slack.py

      - name: Save changes to the repo
        id: save
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then echo "Nothing new."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "atn-sync"
          git config user.email "atn-sync@users.noreply.github.com"
          git add docs
          git commit -m "Sync from Slack: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    # publish on a push, a full resync, or any run that found new posts
    if: >-
      always() && needs.sync.result != 'failure' && needs.sync.result != 'cancelled' &&
      (github.event_name == 'push' || needs.sync.outputs.changed == 'true' || inputs.full_resync == true)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
